<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Password</title>
        <link rel="stylesheet" href="passwd.css">
    </head>
    <body>
        <div class="container">
            <h1>Password Generator</h1>
            <div class="password-box">
                <input type="text" id="password" placeholder="Mot de passe" readonly>
                <button id="copyBtn">Copy</button>
            </div>
            <div class="options">
            <label for="length">Password length :</label>
            <input type="number" id="length" min="4" max="30" value="12">
            <label><input type="checkbox" id="uppercase">Uppercase</label>
            <label><input type="checkbox" id="lowercase">Lowercase</label>
            <label><input type="checkbox" id="numbers">Numbers</label>
            <label><input type="checkbox" id="symbols">Symbols</label>
            </div>
            <button id="generateBtn">Generate password</button>
        </div>
        <script src="passwd.js"></script>
    </body>
</html>
